name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require AVX2
        # The bundled ONNX Runtime dies with SIGILL without AVX2; fail here, not mid-suite.
        run: grep -qw avx2 /proc/cpuinfo || { echo "::error::runner lacks AVX2"; exit 1; }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test (workspace)
        run: cargo test --workspace --no-fail-fast
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install onnxruntime and pytest
        # Exact pins and --only-binary :all: -- same policy as sonar.yml and python-wheel.yml.
        # onnxruntime matches python-wheel.yml's pin.
        run: pip install --only-binary ':all:' onnxruntime==1.30.0 pytest==9.1.1
      - name: cargo test (ort-dylib, core and python crate)
        # The distributed wheel is built with ort-dylib (see pyproject.toml), a cfg-gated
        # code path the default `cargo test --workspace` above never compiles or runs.
        run: |
          ORT_DYLIB_PATH="$(python3 -c 'import glob, os, onnxruntime; print(glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__), "capi", "libonnxruntime.so*"))[0])')"
          export ORT_DYLIB_PATH
          cargo test -p dengjen-tashkeel --no-default-features --features ort-dylib,bundled-model
          cargo test -p dengjen-tashkeel-python --no-default-features --features ort-dylib
      - name: Build the capi cdylib
        # test_ffi_usage_example.py loads this library at import time.
        run: cargo build -p dengjen-tashkeel-capi --locked
      - name: pytest (C API FFI example)
        # Runs here as well as in sonar.yml (which skips fork PRs and only reports coverage).
        working-directory: crates/capi
        run: pytest test_ffi_usage_example.py

  test-platform:
    # The other release targets (windows-msvc, aarch64-apple-darwin, aarch64-linux) otherwise
    # first compile in the release job. The python crate is excluded: it is linked against a
    # system libpython on these runners and is already covered by `test` and python-wheel.yml.
    name: test-platform (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test (workspace, without the python crate)
        run: cargo test --workspace --exclude dengjen-tashkeel-python --locked --no-fail-fast

  windows-import-library:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the capi cdylib
        run: cargo build -p dengjen-tashkeel-capi --release --locked
      - name: Link a C program against the import library
        shell: pwsh
        run: >
          .github/scripts/implib-smoke.ps1
          -ImportLib target/release/dengjen_tashkeel_capi.dll.lib
          -DllDir target/release

  conan-package:
    name: conan-package (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Conan
        run: pip install --only-binary ':all:' conan==2.33.0
      - name: Create the package and run test_package
        run: |
          conan profile detect
          conan create packaging/conan --build=missing

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      java: ${{ steps.filter.outputs.java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        # On a pull_request the checkout is the merge commit, so HEAD^1 is the base.
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ] \
            || git diff --name-only HEAD^1 HEAD \
              | grep -qE '^(crates/(capi|core)/|Cargo\.(toml|lock)$|bindings/java/|\.github/workflows/(CI|java-test)\.yml$)'; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    uses: ./.github/workflows/rust-lint.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    permissions:
      contents: read
      issues: write
      checks: write
      code-quality: write

  wheel:
    uses: ./.github/workflows/python-wheel.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    permissions:
      contents: read

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    uses: ./.github/workflows/java-test.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    permissions:
      contents: read

  # The single required status check: one stable name that survives job and matrix
  # renames, and counts a path-filtered `java` skip as a pass.
  build:
    name: build
    needs: [changes, test, test-platform, windows-import-library, conan-package, lint, wheel, java]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          jq -e 'to_entries | all(.value.result == "success" or (.key == "java" and .value.result == "skipped"))'
          <<< "$NEEDS"
