name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test (workspace)
        run: cargo test --workspace --no-fail-fast
      - name: cargo test (ort-dylib, python crate)
        # crates/python's ort-dylib feature (used by the distributed wheel,
        # see pyproject.toml) is a separate cfg-gated code path the default
        # `cargo test --workspace` above never compiles or runs.
        working-directory: crates/python
        run: |
          cargo test --no-default-features --features ort-dylib find_onnxruntime_lib
          cargo test --no-default-features --features ort-dylib resolve_dylib_path
