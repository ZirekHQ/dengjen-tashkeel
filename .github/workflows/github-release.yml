name: GitHub Release (cargo-dist)
# Hand-patched for Sonar S8233 (write permission moved from workflow to job level) -- re-apply if regenerating via 'cargo dist generate'.
# Hand-patched: added `timeout-minutes` to every job -- re-apply if regenerating via 'cargo dist generate'.
permissions: {}

# Hand-patched: added `workflow_call`, dropped `push: tags` -- re-apply if regenerating via
# 'cargo dist generate'. A workflow_call's ref context is the caller's, not the tag, so the
# `tag` input below replaces `github.ref_name` wherever that distinction matters.
# Hand-patched: dropped `workflow_dispatch` (single-trigger, single-gate) -- re-apply if
# regenerating. release.yml is now the only dispatch surface; this file is workflow_call-only
# plus pull_request, which stays for its own reason (validating the cargo-dist build on PRs).
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
  pull_request:

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && (inputs.tag || github.ref_name) || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', inputs.tag || github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ !github.event.pull_request && (inputs.tag || github.ref_name) || '' }}
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        # Hand-patched for Sonar S8482 (no checksum published for this script) -- re-apply if regenerating via 'cargo dist generate'.
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh -o cargo-dist-installer.sh
          sh cargo-dist-installer.sh
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        # Hand-patched for zizmor template-injection (github.ref_name -> env var) --
        # re-apply if regenerating via 'cargo dist generate'.
        env:
          DIST_ARGS: ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', inputs.tag || github.ref_name)) || 'plan' }}
        run: |
          dist $DIST_ARGS --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # image, when present, is chosen by `dist plan` from dist-workspace.toml, not attacker
    # input; no target in this workspace currently sets one.
    container: ${{ matrix.container && matrix.container.image || null }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ !github.event.pull_request && (inputs.tag || github.ref_name) || '' }}
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            # Hand-patched for Sonar S8482 (rustup.rs is a live, server-side-mutable
            # redirect with no static checksum by design) -- re-apply if regenerating
            # via 'cargo dist generate'.
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
            sh rustup-init.sh -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        # Hand-patched for zizmor template-injection (install_dist.run -> env var) --
        # re-apply if regenerating via 'cargo dist generate'. No `shell:` override --
        # that field's expressions can't see the `runner` context (GitHub Actions
        # rejects the workflow outright), so this relies on the per-OS default shell
        # (pwsh on Windows, bash elsewhere) to pick the matching re-parse below.
        env:
          INSTALL_DIST_RUN: ${{ matrix.install_dist.run }}
        run: ${{ runner.os == 'Windows' && 'Invoke-Expression $env:INSTALL_DIST_RUN' || 'bash -c "$INSTALL_DIST_RUN"' }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        # Hand-patched for zizmor template-injection (packages_install -> env var) --
        # re-apply if regenerating via 'cargo dist generate'.
        shell: bash
        env:
          PACKAGES_INSTALL: ${{ matrix.packages_install }}
        run: |
          $PACKAGES_INSTALL
      - name: Build artifacts
        # Hand-patched for zizmor template-injection (tag-flag/dist_args -> env vars) --
        # re-apply if regenerating via 'cargo dist generate'. Forced to bash, same as the
        # neighboring Post-build step, so $VAR syntax is unambiguous on the Windows runner too.
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          # Actually do builds and make zips and whatnot
          dist build $TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ !github.event.pull_request && (inputs.tag || github.ref_name) || '' }}
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        # Hand-patched for zizmor template-injection (tag-flag -> env var) -- re-apply
        # if regenerating via 'cargo dist generate'.
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist build $TAG_FLAG --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine).
    # Hand-patched: `&& inputs.dry_run != true` -- re-apply if regenerating via 'cargo dist
    # generate'. Stopping before this job means artifacts still built and packaged (real
    # validation) but nothing was uploaded or released.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && inputs.dry_run != true && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    # No environment gate here -- merging the version-bump PR is the real decision point
    # (see #92). This workflow no longer listens for a raw tag push (see the `on:`
    # hand-patch above), so that's the only path that reaches this job.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ !github.event.pull_request && (inputs.tag || github.ref_name) || '' }}
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        # Hand-patched for zizmor template-injection (tag-flag -> env var) -- re-apply
        # if regenerating via 'cargo dist generate'.
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist host $TAG_FLAG --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        # Hand-patched for zizmor template-injection (tag -> env var) -- re-apply if
        # regenerating via 'cargo dist generate'.
        #
        # Hand-patched: dropped `--target "$RELEASE_COMMIT"` -- re-apply if
        # regenerating via 'cargo dist generate'. It's a no-op (tag already
        # exists by now) that costs an extra `workflows: write` grant on
        # GITHUB_TOKEN, since the target commit's tree includes workflow files.
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "$RELEASE_TAG" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
