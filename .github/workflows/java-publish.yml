name: Publish Java bindings

# Publishes the bindings/java Gradle module to Maven Central on the same
# version-tag push that triggers release.yml (Rust) and python-publish.yml
# (Python), so a Maven Central release always lines up with the others.
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  # Manual retrigger for a tag whose run failed for an unrelated reason --
  # mirrors python-publish.yml's `tag` input, since "Use workflow from"
  # defaults to main, which would fail confusingly in check-version below.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish Java bindings for"
        required: true
        type: string
      dry_run:
        description: "Dry Run: build natives but publish nothing"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  check-version:
    name: Verify tag matches Gradle module version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # inputs.tag (workflow_dispatch) is free text from whoever has dispatch
      # access -- unvalidated it'd publish whatever ref it names, real GPG/
      # OSSRH secrets included. Requires the exact vX.Y.Z tag shape, not just matching digits.
      - name: Validate release tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! echo "${RELEASE_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+.*$'; then
            echo "::error::'${RELEASE_TAG}' doesn't look like a vX.Y.Z tag"
            exit 1
          fi
          if ! gh api "repos/${REPO}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::'${RELEASE_TAG}' is not an existing tag on this repository -- refusing to build from an arbitrary ref"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Compare tag to bindings/java/build.gradle.kts version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="$(echo "${RELEASE_TAG}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+.*$')"
          gradle_version="$(grep -m1 '^version = ' bindings/java/build.gradle.kts | sed -E 's/version = "(.*)"/\1/')"
          if [ "${tag_version}" != "${gradle_version}" ]; then
            echo "::error::Tag ${RELEASE_TAG} (version ${tag_version}) does not match bindings/java/build.gradle.kts version ${gradle_version}"
            exit 1
          fi

      # Fails here, before the multi-platform native builds run, rather than deep into the
      # publish job after paying for build-natives -- a missing secret is a maintainer setup gap,
      # not something worth burning CI minutes on before discovering it.
      - name: Verify Maven Central / GPG secrets are set
        if: inputs.dry_run != true
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in JRELEASER_MAVENCENTRAL_USERNAME JRELEASER_MAVENCENTRAL_PASSWORD \
              JRELEASER_GPG_PASSPHRASE JRELEASER_GPG_SECRET_KEY JRELEASER_GPG_PUBLIC_KEY; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secret(s): ${missing[*]}"
            exit 1
          fi

  build-natives:
    name: Build native library (${{ matrix.platform.classifier }})
    needs: check-version
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - classifier: linux-x86_64
            runner: ubuntu-22.04
          - classifier: windows-x64
            runner: windows-2022
          - classifier: macos-aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"

      - name: Build dengjen_tashkeel_capi
        run: cargo build --release -p dengjen-tashkeel-capi --locked

      - name: Stage native library
        shell: bash
        run: |
          mkdir -p "native-artifacts/${{ matrix.platform.classifier }}"
          case "${{ runner.os }}" in
            Linux) lib="target/release/libdengjen_tashkeel_capi.so" ;;
            macOS) lib="target/release/libdengjen_tashkeel_capi.dylib" ;;
            Windows) lib="target/release/dengjen_tashkeel_capi.dll" ;;
          esac
          cp "$lib" "native-artifacts/${{ matrix.platform.classifier }}/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform.classifier }}
          path: native-artifacts/${{ matrix.platform.classifier }}

  publish:
    name: Publish to Maven Central
    needs: build-natives
    runs-on: ubuntu-latest
    # Required even on a dry run (the Publish step below still skips) -- environment protection
    # is per-job-per-run, so a direct dispatch of this workflow would otherwise bypass
    # tag-and-release.yml's `approve` gate entirely.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # A publish-credentialed job must never consume a cache entry a
          # less-trusted run could have written.
          cache-disabled: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/java/native-artifacts
          pattern: "native-*"

      - name: Flatten downloaded native artifacts
        working-directory: bindings/java/native-artifacts
        run: for d in native-*; do mv "$d" "${d#native-}"; done

      # Gated instead of passed a JReleaser-native dry-run flag -- its exact form wasn't
      # verified, and build-natives already runs in full either way for real validation.
      - name: Publish
        if: inputs.dry_run != true
        working-directory: bindings/java
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
        # jreleaserDeploy only uploads to Maven Central -- it does not touch GitHub releases,
        # which release.yml (cargo-dist) already publishes for this same tag.
        run: ./gradlew publish jreleaserDeploy --no-daemon --stacktrace
