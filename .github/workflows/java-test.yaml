name: Java Bindings Test

# Builds the dengjen-tashkeel-capi cdylib and runs the bindings/java Gradle
# test suite against it on every push/PR -- the CI counterpart to
# publish-java.yaml (tag-triggered, publish-only, never runs tests).
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install onnxruntime
        # The published natives load onnxruntime dynamically; the pin matches CI.yaml.
        run: |
          pip install --only-binary ':all:' onnxruntime==1.30.0
          lib="$(python3 -c 'import glob, os, onnxruntime; print(glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__), "capi", "libonnxruntime.so*"))[0])')"
          echo "ORT_DYLIB_PATH=${lib}" >> "$GITHUB_ENV"

      - name: cargo build (capi cdylib, ort-dylib as published)
        run: cargo build -p dengjen-tashkeel-capi --locked --no-default-features --features ort-dylib

      - name: Check the natives fingerprint
        # A native change must refresh bindings/java/natives.fingerprint and bump nativesVersion.
        run: scripts/natives-fingerprint.sh --check

      - name: Check nativesVersion was bumped with the fingerprint
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "${BASE_REF}"
          scripts/natives-fingerprint.sh --check-bump "origin/${BASE_REF}"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle check
        working-directory: bindings/java
        run: ./gradlew check
