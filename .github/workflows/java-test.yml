name: Java Bindings Test

# Builds the dengjen-tashkeel-capi cdylib and runs the bindings/java Gradle
# test suite against it on every push/PR -- the CI counterpart to
# publish-java.yml (tag-triggered, publish-only, never runs tests).
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install onnxruntime
        # The published natives load onnxruntime dynamically; the pin matches CI.yml.
        run: |
          pip install --only-binary ':all:' onnxruntime==1.30.0
          lib="$(python3 -c 'import glob, os, onnxruntime; print(glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__), "capi", "libonnxruntime.so*"))[0])')"
          echo "ORT_DYLIB_PATH=${lib}" >> "$GITHUB_ENV"

      - name: cargo build (capi cdylib, ort-dylib as published)
        run: cargo build -p dengjen-tashkeel-capi --locked --no-default-features --features ort-dylib

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle check
        working-directory: bindings/java
        run: ./gradlew check
