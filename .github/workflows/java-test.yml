name: Java Bindings Test

# Builds the dengjen-tashkeel-capi cdylib and runs the bindings/java Gradle
# test suite against it on every push/PR -- the CI counterpart to
# publish-java.yml (tag-triggered, publish-only, never runs tests).
on:
  push:
    branches: [ main ]
    paths:
      - 'crates/capi/**'
      - 'bindings/java/**'
      - '.github/workflows/java-test.yml'
  pull_request:
    paths:
      - 'crates/capi/**'
      - 'bindings/java/**'
      - '.github/workflows/java-test.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: java-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo build (capi cdylib)
        run: cargo build -p dengjen-tashkeel-capi --locked

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle check
        working-directory: bindings/java
        run: ./gradlew check
