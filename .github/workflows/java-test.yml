name: Java Bindings Test

# Builds the dengjen-tashkeel-capi cdylib and runs the bindings/java Gradle
# test suite against it on every push/PR -- the CI counterpart to
# java-publish.yml (tag-triggered, publish-only, never runs tests).
on:
  push:
    branches: [ main ]
    paths:
      - 'crates/capi/**'
      - 'bindings/java/**'
      - '.github/workflows/java-test.yml'
  pull_request:
    paths:
      - 'crates/capi/**'
      - 'bindings/java/**'
      - '.github/workflows/java-test.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: java-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: cargo build (capi cdylib)
        run: cargo build -p dengjen-tashkeel-capi --locked

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle check
        working-directory: bindings/java
        run: ./gradlew check
