name: Natives fingerprint

# Renovate cannot run scripts/natives-fingerprint.sh, so its dependency bumps leave the
# fingerprint stale. Pushes with an App token: a GITHUB_TOKEN push would not trigger CI.
on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/core/**
      - crates/capi/**

permissions: {}

jobs:
  refresh:
    if: github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Refresh the fingerprint and bump nativesVersion
        run: scripts/natives-fingerprint.sh --bump

      - name: Push the refresh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          git diff --quiet && exit 0
          git config user.name "natives-fingerprint[bot]"
          git config user.email "natives-fingerprint[bot]@users.noreply.github.com"
          git commit -am "chore(deps): refresh natives fingerprint NOJIRA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${HEAD_REF}"
