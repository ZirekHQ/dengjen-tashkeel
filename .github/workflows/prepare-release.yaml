name: Prepare release

# Proposes a release; merging the opened PR is what actually cuts one -- release.yaml tags that
# merge commit and triggers every downstream release workflow automatically.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only compute the release plan, do not open the version-bump PR"
        type: boolean
        required: false
        default: true

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require a maintainer on main
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error::Releases are prepared from main, not $REF"
            exit 1
          fi
          role=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .role_name)
          case "$role" in
            admin|maintain) echo "$ACTOR has role $role" ;;
            *) echo "::error::$ACTOR has role '$role'; preparing a release needs admin or maintain"; exit 1 ;;
          esac

  prepare:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      APP_CLIENT_ID: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
    steps:
      - name: Create release app token
        id: app-token
        # A PR opened with GITHUB_TOKEN gets no CI, so it could never satisfy the required
        # `build` check. Without the app secrets the PR is still opened, but needs a manual
        # close/reopen to start its checks.
        if: ${{ !inputs.dry_run && env.APP_CLIENT_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          # exit 1 = normal "nothing release-worthy", treated as skip. Any
          # other exit means the computation itself is broken and must fail
          # loudly, or a broken tag state would silently suppress every future release.
          # The `&& rc=0 || rc=$?` form keeps the default `bash -e` shell from aborting on exit 1.
          version="$(bash scripts/next-version.sh)" && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "### Release plan: v${version}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Release plan: nothing to release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi

      - name: Bump version
        if: steps.next.outputs.skip != 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: bash scripts/bump-version.sh "$VERSION"

      - name: Open release PR
        if: steps.next.outputs.skip != 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock bindings/java/build.gradle.kts README.md \
            docs/modules/ROOT/pages/installation.adoc crates/capi/Cargo.toml crates/cli/Cargo.toml crates/python/Cargo.toml
          git commit -m "chore: bump workspace version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: bump workspace version -> ${VERSION}" \
            --body "Computed by \`prepare-release.yaml\` from Conventional Commit subjects since the last tag (see \`scripts/next-version.sh\`). **Merging this releases v${VERSION}**: \`release.yaml\` tags this merge commit \`v${VERSION}\` and triggers \`github-release.yaml\` (GitHub Release), \`publish-python.yaml\` (PyPI), \`publish-java.yaml\` (Maven Central), and \`publish-crates.yaml\` (crates.io) automatically, no further approval needed. The required checks on this PR are the only gate: review the version and the diff before merging (the vcpkg/Conan follow-up in CONTRIBUTING.md's step 4 still needs its own PR once the release archives exist)." \
            --base main --head "$branch"
