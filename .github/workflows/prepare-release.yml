name: Prepare release

# Proposes a release; merging the opened PR is what actually cuts one -- release.yml tags that
# merge commit and triggers every downstream release workflow automatically.
on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: "Skip the PR: release this exact vX.Y.Z tag directly (requires approval)"
        required: false
        type: string
      dry_run:
        description: "Dry Run: publish nothing (only used together with new_tag)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Normal path: compute the next version and open the PR. Merging it is the release gate
  # (see .github/CONTRIBUTING.md) -- nothing here needs approval of its own. Skipped when
  # new_tag selects the direct-release override path below instead.
  prepare:
    if: inputs.new_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"

      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          # exit 1 = normal "nothing release-worthy", treated as skip. Any
          # other exit means the computation itself is broken and must fail
          # loudly, or a broken tag state would silently suppress every future release.
          version="$(bash scripts/next-version.sh)"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi

      - name: Bump version
        if: steps.next.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: bash scripts/bump-version.sh "$VERSION"

      - name: Open release PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock bindings/java/build.gradle.kts README.md \
            crates/capi/Cargo.toml crates/cli/Cargo.toml crates/python/Cargo.toml
          git commit -m "chore: bump workspace version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: bump workspace version -> ${VERSION}" \
            --body "Computed by \`prepare-release.yml\` from Conventional Commit subjects since the last tag (see \`scripts/next-version.sh\`). **Merging this releases v${VERSION}**: \`release.yml\` tags this merge commit \`v${VERSION}\` and triggers \`github-release.yml\` (GitHub Release), \`publish-python.yml\` (PyPI), \`publish-java.yml\` (Maven Central), and \`publish-crates.yml\` (crates.io) automatically, no further approval needed. Review the version and the diff carefully before merging -- this is the real decision point (the vcpkg/Conan follow-up in CONTRIBUTING.md's step 4 still needs its own PR once the release archives exist)." \
            --base main --head "$branch"

  # Override path: skip prepare/PR entirely and hand off straight to release.yml. This is
  # the one path in the whole pipeline with no PR review to fall back on, so it's the only
  # thing that still needs a human gate.
  gate:
    if: inputs.new_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - run: echo "approved"

  release-now:
    needs: gate
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
    with:
      new_tag: ${{ inputs.new_tag }}
      dry_run: ${{ inputs.dry_run == true }}
