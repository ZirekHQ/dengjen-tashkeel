name: Prepare release

# Computes the next semver from Conventional Commits since the last vX.Y.Z
# tag and opens a PR bumping every hand-synced version copy. Manual trigger
# only -- merging that PR is what lets tag-and-release.yml cut the release.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"

      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          # exit 1 = normal "nothing release-worthy", treated as skip. Any
          # other exit means the computation itself is broken and must fail
          # loudly, or a broken tag state would silently suppress every future release.
          version="$(bash scripts/next-version.sh)"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi

      - name: Bump version
        if: steps.next.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: bash scripts/bump-version.sh "$VERSION"

      - name: Open release PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock bindings/java/build.gradle.kts README.md
          git commit -m "chore: bump workspace version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: bump workspace version -> ${VERSION}" \
            --body "Computed by \`prepare-release.yml\` from Conventional Commit subjects since the last tag (see \`scripts/next-version.sh\`). **Merging this releases v${VERSION}**: \`tag-and-release.yml\` tags this merge commit \`v${VERSION}\` and triggers \`release.yml\` (GitHub Release), \`python-publish.yml\` (PyPI), \`java-publish.yml\` (Maven Central), and \`publish.yml\` (crates.io) automatically. Review the version and the diff before merging -- there's no further manual gate after this (the vcpkg/Conan follow-up in CONTRIBUTING.md's step 5 still needs its own PR once the release archives exist)." \
            --base main --head "$branch"
