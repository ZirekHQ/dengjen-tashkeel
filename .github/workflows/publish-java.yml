name: Publish Java bindings

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME:
        required: false
      JRELEASER_MAVENCENTRAL_PASSWORD:
        required: false
      JRELEASER_GPG_PASSPHRASE:
        required: false
      JRELEASER_GPG_SECRET_KEY:
        required: false
      JRELEASER_GPG_PUBLIC_KEY:
        required: false

permissions: {}

jobs:
  check-version:
    name: Verify tag matches Gradle module version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check-published.outputs.skip }}
      skip_model: ${{ steps.check-published.outputs.skip_model }}
      skip_natives: ${{ steps.check-published.outputs.skip_natives }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Compare tag to bindings/java/build.gradle.kts version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="$(echo "${RELEASE_TAG}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+.*$')"
          gradle_version="$(grep -m1 '^version = ' bindings/java/build.gradle.kts | sed -E 's/version = "(.*)"/\1/')"
          if [ "${tag_version}" != "${gradle_version}" ]; then
            echo "::error::Tag ${RELEASE_TAG} (version ${tag_version}) does not match bindings/java/build.gradle.kts version ${gradle_version}"
            exit 1
          fi

      - name: Check whether this version is already on Maven Central
        id: check-published
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(echo "${RELEASE_TAG}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+.*$')"
          model_version="$(grep -m1 '^val modelVersion = ' bindings/java/build.gradle.kts | sed -E 's/val modelVersion = "(.*)"/\1/')"
          if ! [[ "${model_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::could not read modelVersion from bindings/java/build.gradle.kts" >&2
            exit 1
          fi
          model_url="https://repo1.maven.org/maven2/io/github/zirekhq/dengjen-tashkeel-model/${model_version}/dengjen-tashkeel-model-${model_version}.pom"
          model_status="$(curl -s -o /dev/null -w '%{http_code}' "$model_url")"
          case "$model_status" in
            200) echo "skip_model=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip_model=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::unexpected HTTP ${model_status} checking Maven Central for dengjen-tashkeel-model ${model_version}" >&2
              exit 1
              ;;
          esac
          natives_version="$(grep -m1 '^val nativesVersion = ' bindings/java/build.gradle.kts | sed -E 's/val nativesVersion = "(.*)"/\1/')"
          if ! [[ "${natives_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::could not read nativesVersion from bindings/java/build.gradle.kts" >&2
            exit 1
          fi
          natives_pom="https://repo1.maven.org/maven2/io/github/zirekhq/dengjen-tashkeel-natives/${natives_version}/dengjen-tashkeel-natives-${natives_version}.pom"
          natives_status="$(curl -s -o "${RUNNER_TEMP}/natives.pom" -w '%{http_code}' "$natives_pom")"
          case "$natives_status" in
            200)
              published="$(grep -oE '<dengjen.natives.fingerprint>[0-9a-f]+<' "${RUNNER_TEMP}/natives.pom" | grep -oE '[0-9a-f]{64}' || true)"
              recorded="$(tr -d '[:space:]' < bindings/java/natives.fingerprint)"
              if [ "${published}" != "${recorded}" ]; then
                echo "::error::dengjen-tashkeel-natives ${natives_version} is on Maven Central with a different fingerprint; bump nativesVersion in bindings/java/build.gradle.kts" >&2
                exit 1
              fi
              echo "skip_natives=true" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "skip_natives=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::unexpected HTTP ${natives_status} checking Maven Central for dengjen-tashkeel-natives ${natives_version}" >&2
              exit 1
              ;;
          esac
          url="https://repo1.maven.org/maven2/io/github/zirekhq/dengjen-tashkeel/${version}/dengjen-tashkeel-${version}.pom"
          status="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
          case "$status" in
            200)
              echo "::notice::dengjen-tashkeel ${version} is already on Maven Central -- skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected HTTP ${status} checking Maven Central for dengjen-tashkeel ${version}" >&2
              exit 1
              ;;
          esac

  build-natives:
    name: Build native library (${{ matrix.platform.classifier }})
    needs: check-version
    if: needs.check-version.outputs.skip != 'true' && needs.check-version.outputs.skip_natives != 'true'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - classifier: linux-x86_64
            runner: ubuntu-22.04
          - classifier: linux-aarch64
            runner: ubuntu-22.04-arm
          - classifier: windows-x64
            runner: windows-2022
          - classifier: macos-aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"

      - name: Build dengjen_tashkeel_capi
        # ort-dylib leaves onnxruntime out and no bundled-model leaves the model out (it ships as
        # the dengjen-tashkeel-model artifact), so each library is ~1 MB instead of ~13 MB.
        run: cargo build --release -p dengjen-tashkeel-capi --locked --no-default-features --features ort-dylib

      - name: Stage native library
        shell: bash
        run: |
          mkdir -p "native-artifacts/${{ matrix.platform.classifier }}"
          case "${{ runner.os }}" in
            Linux) lib="target/release/libdengjen_tashkeel_capi.so" ;;
            macOS) lib="target/release/libdengjen_tashkeel_capi.dylib" ;;
            Windows) lib="target/release/dengjen_tashkeel_capi.dll" ;;
          esac
          cp "$lib" "native-artifacts/${{ matrix.platform.classifier }}/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform.classifier }}
          path: native-artifacts/${{ matrix.platform.classifier }}

  publish:
    name: Publish to Maven Central
    needs: [check-version, build-natives]
    # build-natives is skipped when the natives version is already on Central.
    if: ${{ !cancelled() && needs.check-version.result == 'success' && needs.check-version.outputs.skip != 'true' && needs.build-natives.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Holds the Maven Central and GPG secrets behind the environment's required reviewers.
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      # Environment secrets are only visible to a job that declares the environment, so this
      # check lives in the publish job and fails before Gradle runs.
      - name: Verify Maven Central / GPG secrets are set
        if: inputs.dry_run != true
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in JRELEASER_MAVENCENTRAL_USERNAME JRELEASER_MAVENCENTRAL_PASSWORD \
              JRELEASER_GPG_PASSPHRASE JRELEASER_GPG_SECRET_KEY JRELEASER_GPG_PUBLIC_KEY; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s) in the maven-central environment: ${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # A publish-credentialed job must never consume a cache entry a
          # less-trusted run could have written.
          cache-disabled: true

      - if: needs.check-version.outputs.skip_natives != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/java/native-artifacts
          pattern: "native-*"

      - name: Flatten downloaded native artifacts
        if: needs.check-version.outputs.skip_natives != 'true'
        working-directory: bindings/java/native-artifacts
        run: for d in native-*; do mv "$d" "${d#native-}"; done

      # Gated instead of passed a JReleaser-native dry-run flag -- its exact form wasn't
      # verified, and build-natives already runs in full either way for real validation.
      - name: Publish
        if: inputs.dry_run != true
        working-directory: bindings/java
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          SKIP_MODEL: ${{ needs.check-version.outputs.skip_model }}
          SKIP_NATIVES: ${{ needs.check-version.outputs.skip_natives }}
        # jreleaserDeploy only uploads to Maven Central -- it does not touch GitHub releases,
        # which github-release.yml (cargo-dist) already publishes for this same tag.
        run: ./gradlew publish jreleaserDeploy --no-daemon --stacktrace -PskipModelPublish="${SKIP_MODEL}" -PskipNativesPublish="${SKIP_NATIVES}"

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jreleaser-release
          path: |
            bindings/java/build/jreleaser/trace.log
            bindings/java/build/jreleaser/output.properties
          if-no-files-found: ignore
