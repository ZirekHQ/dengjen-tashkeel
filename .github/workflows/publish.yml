name: Publish to crates.io

on:
  push:
    tags:
      - "publish-*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"

      - name: publish dengjen-tashkeel
        run: cargo publish -p dengjen-tashkeel --locked
      - name: wait for crate to index
        run: bash .github/scripts/wait-for-crate.sh dengjen-tashkeel 1.5.1
