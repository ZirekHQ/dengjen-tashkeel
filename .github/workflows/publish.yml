name: Publish to crates.io

on:
  push:
    tags:
      - "publish-*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"

      - name: Resolve workspace version
        # Read from [workspace.package] rather than hardcoding the version here,
        # so this file doesn't silently go stale (and publish the wrong version)
        # the next time the workspace version bumps.
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # A "publish-*" tag can be re-pushed to retry a partial failure (e.g. one
      # crate publishes, the next 403s on a missing token scope) -- re-running
      # `cargo publish` on a version crates.io already has is a hard failure,
      # not a no-op, so skip crates that are already live at this version.
      - name: publish dengjen-tashkeel
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if curl -sf "https://crates.io/api/v1/crates/dengjen-tashkeel/${version}" >/dev/null; then
            echo "dengjen-tashkeel ${version} is already published -- skipping"
          else
            cargo publish -p dengjen-tashkeel --locked
          fi
      - name: wait for crate to index
        run: bash .github/scripts/wait-for-crate.sh dengjen-tashkeel "${{ steps.version.outputs.version }}"

      - name: publish dengjen-tashkeel-cli
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if curl -sf "https://crates.io/api/v1/crates/dengjen-tashkeel-cli/${version}" >/dev/null; then
            echo "dengjen-tashkeel-cli ${version} is already published -- skipping"
          else
            cargo publish -p dengjen-tashkeel-cli --locked
          fi
      - name: wait for crate to index
        run: bash .github/scripts/wait-for-crate.sh dengjen-tashkeel-cli "${{ steps.version.outputs.version }}"
