name: Publish to crates.io

# Invoked as a job of release.yml right after tagging vX.Y.Z; also
# dispatchable by hand as the retry path since every step is idempotent. Not
# tag-triggered itself -- a mistaken v*-shaped tag push would publish for real.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run: publish nothing"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Only gates workflow_dispatch: release.yml's real decision point is merging the version-bump
  # PR (#92) -- but a manual dispatch bypasses that entirely, unlike workflow_call.
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - run: echo "approved"

  publish:
    needs: gate
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-semver-checks
      # dengjen-tashkeel-cli has no `lib` target (bin-only), so it has no public
      # API surface for cargo-semver-checks to compare -- only the core crate is checked.
      - name: cargo semver-checks (dengjen-tashkeel)
        run: cargo semver-checks check-release -p dengjen-tashkeel
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Resolve workspace version
        # Read from [workspace.package] rather than hardcoding the version here,
        # so this file doesn't silently go stale (and publish the wrong version)
        # the next time the workspace version bumps.
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Every value flows through `env:` rather than interpolated directly
      # into `run:` -- GH Actions expands `${{ }}` as literal text before the
      # shell runs it, so an env var (a real variable) can't reinterpret the script.
      #
      # crates.io's API 403s any request without a descriptive User-Agent
      # (the bare "curl/x.y.z" default doesn't qualify) -- set one explicitly
      # or every lookup below fails before it gets to check anything.
      - name: publish dengjen-tashkeel
        # curl -sf can't tell "confirmed not published" (404) from a
        # transient failure (5xx) -- both look like a bare nonzero exit, and
        # treating them the same risks a real publish attempt on the transient-failure path.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: dengjen-tashkeel-ci (https://github.com/ZirekHQ/dengjen-tashkeel)" "https://crates.io/api/v1/crates/dengjen-tashkeel/${VERSION}")"
          case "$status" in
            200) echo "dengjen-tashkeel ${VERSION} is already published -- skipping" ;;
            404) cargo publish -p dengjen-tashkeel --locked ${{ inputs.dry_run && '--dry-run' || '' }} ;;
            *) echo "::error::Unexpected status ${status} checking crates.io for dengjen-tashkeel ${VERSION}"; exit 1 ;;
          esac
      # --dry-run doesn't actually publish, so there's nothing on crates.io for this step to wait on.
      - name: wait for crate to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/wait-for-crate.sh dengjen-tashkeel "$VERSION"

      - name: publish dengjen-tashkeel-cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: dengjen-tashkeel-ci (https://github.com/ZirekHQ/dengjen-tashkeel)" "https://crates.io/api/v1/crates/dengjen-tashkeel-cli/${VERSION}")"
          case "$status" in
            200) echo "dengjen-tashkeel-cli ${VERSION} is already published -- skipping" ;;
            404) cargo publish -p dengjen-tashkeel-cli --locked ${{ inputs.dry_run && '--dry-run' || '' }} ;;
            *) echo "::error::Unexpected status ${status} checking crates.io for dengjen-tashkeel-cli ${VERSION}"; exit 1 ;;
          esac
      - name: wait for crate to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/wait-for-crate.sh dengjen-tashkeel-cli "$VERSION"
