name: Publish Python wheels

# Builds real dengjen-tashkeel-py wheels and publishes them to PyPI on a
# version-tag push (same tag pattern release.yml uses for the GitHub Release,
# so a PyPI release always lines up with a Rust release). This is separate
# from python-wheel.yml, which builds an ubuntu-latest smoke-test wheel on
# every push/PR to guard the glibc floor -- not a real release artifact.
#
# Platform matrix mirrors [workspace.metadata.dist]'s targets in Cargo.toml
# (Intel macOS is dropped there as unsupported, so it's dropped here too).
# PyO3 is built abi3-py39 (crates/python/Cargo.toml), so one wheel per
# platform covers every CPython >=3.9 -- no Python-version axis needed.
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  # Manual retrigger for a tag whose run failed for a reason unrelated to the
  # tag itself (e.g. a broken action pin) -- run this with "Use workflow
  # from" set to the existing vX.Y.Z tag, not a branch. GITHUB_REF_NAME (and
  # what actions/checkout below fetches) comes from whichever ref is
  # selected there, so check-version's tag-vs-workspace comparison still
  # applies unchanged; there's no separate "which version" input to keep in
  # sync with that.
  workflow_dispatch: {}

permissions: {}

jobs:
  check-version:
    name: Verify tag matches crate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compare tag to workspace version
        # Tags are cargo-dist style ("v1.5.1", "1.5.1", ...) -- strip any
        # leading non-digit prefix so this matches release.yml's own tag
        # parsing, then fail the publish rather than ship a wheel whose
        # version doesn't match what the tag announces.
        #
        # crates/python/Cargo.toml declares `version.workspace = true`, so it
        # has no literal package-version line of its own -- the version lives
        # in the root Cargo.toml's [workspace.package] table. Grepping the
        # python crate's manifest directly would instead match the first
        # dependency's `version = "..."` line (e.g. pyo3's), which is never
        # the package version.
        run: |
          set -euo pipefail
          tag_version="$(echo "${GITHUB_REF_NAME}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+.*$')"
          cargo_version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match workspace version ${cargo_version}"
            exit 1
          fi

  build-wheels:
    name: build (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            # Matches the manylinux_2_28 glibc floor pyproject.toml documents
            # for the ort-dylib feature (see its [tool.maturin] comment).
            manylinux: "2_28"
          - target: aarch64-apple-darwin
            runner: macos-14
            manylinux: auto
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            manylinux: auto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Python
        # Only needed for the native macOS/Windows builds; the Linux leg
        # builds inside maturin-action's own manylinux container image,
        # which already bundles the Python interpreters it needs.
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          working-directory: crates/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-${{ matrix.target }}
          path: crates/python/dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # gh-action-pypi-publish trades this OIDC token for a short-lived PyPI
      # upload credential via the trusted-publisher config on the PyPI
      # project -- no long-lived API token stored as a repo secret.
      id-token: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
