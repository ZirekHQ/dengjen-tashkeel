name: Publish Python wheels

# Builds real dengjen-tashkeel-py wheels and publishes to PyPI, invoked as a
# job of tag-and-release.yml right after the release tag is pushed. Separate
# from python-wheel.yml, which builds an ubuntu-latest smoke-test wheel on
# every push/PR, not a release artifact.
#
# Platform matrix mirrors [workspace.metadata.dist]'s Cargo.toml targets
# (Intel macOS dropped there, dropped here too). PyO3 is abi3-py39, so one
# wheel per platform covers every CPython >=3.9 -- no version axis needed.
on:
  # Manual retrigger for a tag whose run failed for an unrelated reason.
  # Takes an explicit `tag` input rather than "Use workflow from" (which
  # defaults to main); every checkout in this file uses this input.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish wheels for"
        required: true
        type: string
      dry_run:
        description: "Dry Run: build wheels but publish nothing"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  check-version:
    name: Verify tag matches crate version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # inputs.tag (workflow_dispatch) is free text from whoever has dispatch
      # access -- unvalidated it'd build+publish whatever ref it names.
      # Requires the exact vX.Y.Z tag shape, not just matching digits.
      - name: Validate release tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! echo "${RELEASE_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+.*$'; then
            echo "::error::'${RELEASE_TAG}' doesn't look like a vX.Y.Z tag"
            exit 1
          fi
          if ! gh api "repos/${REPO}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::'${RELEASE_TAG}' is not an existing tag on this repository -- refusing to build from an arbitrary ref"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Compare tag to workspace version
        # Tags are cargo-dist style ("v1.5.1", "1.5.1", ...) -- strip any
        # leading non-digit prefix to match release.yml's own tag parsing,
        # then fail rather than ship a wheel whose version doesn't match the tag.
        #
        # crates/python/Cargo.toml has `version.workspace = true` -- no literal
        # package-version line of its own; it lives in root Cargo.toml's
        # [workspace.package]. Grepping this file directly would hit a dependency's version instead.
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="$(echo "${RELEASE_TAG}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+.*$')"
          cargo_version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "::error::Tag ${RELEASE_TAG} (version ${tag_version}) does not match workspace version ${cargo_version}"
            exit 1
          fi

  build-wheels:
    name: build (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            # Matches the manylinux_2_28 glibc floor pyproject.toml documents
            # for the ort-dylib feature (see its [tool.maturin] comment).
            manylinux: "2_28"
          - target: aarch64-apple-darwin
            runner: macos-14
            manylinux: auto
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            manylinux: auto
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install Python
        # Only needed for the native macOS/Windows builds; both Linux legs
        # build inside maturin-action's own manylinux container image,
        # which already bundles the Python interpreters it needs.
        if: matrix.target != 'x86_64-unknown-linux-gnu' && matrix.target != 'aarch64-unknown-linux-gnu'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: crates/python/dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: build (sdist)
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/python
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-sdist
          path: crates/python/dist/*.tar.gz
          if-no-files-found: error

  # Only gates workflow_dispatch, unlike workflow_call (release.yml's merge-the-PR decision
  # point already covers that path). Separate from publish's own `environment: pypi` below,
  # which scopes the OIDC trusted-publisher match, not human approval.
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - run: echo "approved"

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, gate]
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # gh-action-pypi-publish trades this OIDC token for a short-lived PyPI
      # upload credential via the trusted-publisher config on the PyPI
      # project -- no long-lived API token stored as a repo secret.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      # gh-action-pypi-publish has no dry-run mode of its own, so the wheels
      # still build above (real validation) and only this network upload is
      # skipped.
      - name: Publish to PyPI
        if: inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
