name: Python Wheel

# Builds the wheel the way an external pipeline would (plain `maturin
# build`) and smoke-tests it across recent Ubuntu LTS releases, to guard the
# glibc/libstdc++ floor fixed for issue #29 (onnxruntime now loads dynamically).
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-wheel-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        # Pins the three most recent Ubuntu LTS releases (re-derive at update
        # time -- LTS ships every April); "latest" is Docker Hub's unpinned
        # tag, left to drift deliberately so CI tests whatever that currently means.
        ubuntu: ["22.04", "24.04", "26.04", "latest"]
    steps:
      - name: Install build prerequisites
        # No actions/checkout or dtolnay/rust-toolchain equivalent exists
        # for arbitrary `container:` images, so bootstrap from scratch
        # instead of relying on pre-installed tooling.
        env:
          # ubuntu:XX container images have no TTY and no prior debconf
          # answers, so anything pulling in tzdata blocks forever on an
          # interactive "Geographic area:" prompt without this.
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update -qq
          apt-get install -y -qq curl build-essential ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          bash .github/scripts/install-rustup.sh --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal -c clippy,rustfmt
          rustup default 1.97.1

      - name: Install uv and Python 3.11
        # onnxruntime>=1.28 dropped cp310 wheels, so 22.04's stock python3
        # (3.10) can't install it. deadsnakes dropped 20.04/focal entirely
        # (why it's not in this matrix) -- fetch a self-contained Python 3.11 via uv instead.
        run: |
          # Pinned release asset plus a checksum, instead of astral.sh's mutable latest redirect.
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/astral-sh/uv/releases/download/0.12.17/uv-installer.sh -o uv-install.sh
          echo "37b82230b28617c6c24fa52364fa28aa37f2aa40c114809a623f6b064a9730e5  uv-install.sh" | sha256sum -c -
          sh uv-install.sh
          rm uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install maturin
        run: |
          # --seed installs pip into the venv; uv venv doesn't by default,
          # so without it /venv/bin/pip wouldn't exist for the steps below.
          uv venv /venv --python 3.11 --seed
          /venv/bin/pip install --only-binary :all: maturin==1.14.1
          echo "/venv/bin" >> "$GITHUB_PATH"

      - name: Build wheel (no --features flag, mirrors an external build pipeline)
        working-directory: crates/python
        run: maturin build --release --out dist

      - name: Install wheel and smoke-test the import
        # onnxruntime pinned exactly (SonarCloud's githubactions:S8544 flags
        # unresolved-version installs) -- bump alongside pyproject.toml's own
        # >=1.28,<2 range. --no-deps on the wheel so pip doesn't re-resolve it.
        run: |
          pip install --only-binary :all: onnxruntime==1.30.0
          whl="$(ls crates/python/dist/*.whl)"
          req="$(mktemp)"
          printf 'file://%s --hash=sha256:%s\n' "$PWD/$whl" "$(sha256sum "$whl" | cut -d' ' -f1)" > "$req"
          pip install --require-hashes --no-index --no-deps --only-binary :all: -r "$req"
          python3 .github/scripts/wheel_smoke_test.py
