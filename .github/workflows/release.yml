name: Release

# Only acts on the commit landing prepare-release.yml's version-bump PR
# (matched by its exact commit subject, the only commit on that branch).
# Every other push to main is a no-op here.
#
# One vX.Y.Z tag feeds all four registries (crates.io, PyPI, Maven Central,
# GitHub Releases) as reusable-workflow jobs of this same run. The bump PR's
# required checks are the only gate: the merge commit is the tested PR head,
# so nothing here waits on CI. vcpkg/Conan (CONTRIBUTING.md step 4) stay
# manual -- they need the release archives first.
on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serializes duplicate dispatches of the same tag. Keyed on the commit otherwise so pushes
# to main never queue behind (and never replace) each other -- a replaced pending run would
# silently drop a release.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        # Python's version is dynamic from Cargo.toml, so Cargo.toml plus build.gradle.kts
        # covers all four published packages; bump-version.sh writes both.
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          gradle_version="$(awk -F'"' '/^version = /{print $2; exit}' bindings/java/build.gradle.kts)"
          if [ "$version" != "$gradle_version" ]; then
            echo "::error::Cargo.toml (${version}) and build.gradle.kts (${gradle_version}) disagree" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Require the merged PR to be the version-bump PR
        # Squash merges make the PR title the commit subject, so the subject alone proves
        # nothing; the head branch has to come from this repo and name this exact version.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          heads="$(gh api "repos/${REPO}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[] | select(.merged_at != null and .head.repo.full_name == "'"${REPO}"'") | .head.ref')"
          if ! grep -qx "chore/bump-${VERSION}" <<<"$heads"; then
            echo "::error::${GITHUB_SHA} was not merged from this repo's chore/bump-${VERSION} branch (found: ${heads:-none})" >&2
            exit 1
          fi

      - name: Push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Checked against origin: ls-remote needs the `^{}`-suffixed query to
        # peel an annotated tag to its commit SHA (unsuffixed returns the tag
        # object's own SHA instead).
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

  release:
    name: GitHub Release (cargo-dist)
    needs: tag-and-release
    # Default `if: success()` would auto-skip this job if tag-and-release was itself skipped
    # (e.g. an unrelated push to main) -- always() plus the explicit result check makes that
    # intentional instead of implicit.
    if: always() && needs.tag-and-release.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}

  crates:
    name: crates.io
    needs: tag-and-release
    if: always() && needs.tag-and-release.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-crates.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support

  java:
    name: Maven Central (Java bindings)
    needs: tag-and-release
    if: always() && needs.tag-and-release.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-java.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}

  python:
    name: PyPI
    needs: tag-and-release
    if: always() && needs.tag-and-release.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-python.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}

  docs:
    name: Notify docs site
    needs: [tag-and-release, release]
    # The release:published event never fires for releases created with GITHUB_TOKEN
    # (github-release.yml), so notify-docs.yml is called from here instead.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/notify-docs.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      ref: v${{ needs.tag-and-release.outputs.version }}
    secrets:
      DOCS_APP_CLIENT_ID: ${{ secrets.DOCS_APP_CLIENT_ID }}
      DOCS_APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}

  announce:
    name: Announce the release
    needs: [tag-and-release, release, crates, java, python]
    if: >-
      ${{ !cancelled() &&
      needs.release.result == 'success' && needs.crates.result == 'success' &&
      needs.java.result == 'success' && needs.python.result == 'success' }}
    permissions: {}
    uses: ZirekHQ/.github/.github/workflows/announce-release.yml@52615e22ae945467ecd94ebde50ef51790b21dd1 # main
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}
    secrets:
      MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
