name: Release

# Only acts on the commit landing prepare-release.yml's version-bump PR
# (matched by its exact commit subject, the only commit on that branch).
# Every other push to main is a no-op here.
#
# One vX.Y.Z tag now feeds all four registries (crates.io, PyPI, Maven
# Central, GitHub Releases) as reusable-workflow jobs of this same run.
# No trigger or gate of its own -- prepare-release.yml is the single entry
# point into the whole pipeline (its `prepare` job for the PR-merge path,
# its `gate` + `release-now` jobs for the direct-release override path);
# this file only reacts to that PR's merge commit landing on main (push) or
# being invoked directly by prepare-release.yml's override path
# (workflow_call). vcpkg/Conan (CONTRIBUTING.md step 4) stays manual --
# needs the release archives first.
#
# Tag push itself isn't gated by dry_run -- github-release.yml/publish-python.yml/
# publish-java.yml/publish-crates.yml all need a real tag ref to build against.
# Only the publish steps inside those jobs honor dry_run.
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      new_tag:
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # github.event_name inherits the top-level caller's original event (workflow_dispatch) rather
    # than literally being 'workflow_call', so it can't detect the override path -- confirmed by a
    # live dispatch that showed this job skipped under that condition. inputs.new_tag != '' detects
    # it directly instead; head_commit is absent under workflow_call, hence checking new_tag first.
    if: >-
      inputs.new_tag != '' ||
      startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          if [ -n "${NEW_TAG:-}" ]; then
            version="${NEW_TAG#v}"
            if ! echo "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::new_tag '${NEW_TAG}' doesn't look like a vX.Y.Z tag" >&2
              exit 1
            fi
            # Python's version is dynamic from Cargo.toml, so checking Cargo.toml
            # and build.gradle.kts covers all four published packages.
            gradle_version="$(awk -F'"' '/^version = /{print $2; exit}' bindings/java/build.gradle.kts)"
            if [ "$version" != "$cargo_version" ] || [ "$version" != "$gradle_version" ]; then
              echo "::error::new_tag version '${version}' doesn't match package metadata (Cargo.toml: ${cargo_version}, build.gradle.kts: ${gradle_version})" >&2
              exit 1
            fi
          else
            version="$cargo_version"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Checked against origin: ls-remote needs the `^{}`-suffixed query to
        # peel an annotated tag to its commit SHA (unsuffixed returns the tag
        # object's own SHA instead). Not gated by dry_run -- see file header.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

  release:
    name: GitHub Release (cargo-dist)
    needs: tag-and-release
    # Default `if: success()` would auto-skip this job if tag-and-release was itself skipped
    # (e.g. an unrelated push to main) -- always() plus the explicit result check makes that
    # intentional instead of implicit.
    if: always() && needs.tag-and-release.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}

  crates:
    name: crates.io
    needs: tag-and-release
    if: always() && needs.tag-and-release.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-crates.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      dry_run: ${{ inputs.dry_run == true }}

  java:
    name: Maven Central (Java bindings)
    needs: tag-and-release
    if: always() && needs.tag-and-release.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-java.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}

  python:
    name: PyPI
    needs: tag-and-release
    if: always() && needs.tag-and-release.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-python.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}
