name: Release

# Only acts on the commit landing prepare-release.yml's version-bump PR
# (matched by its exact commit subject, the only commit on that branch).
# Every other push to main is a no-op here.
#
# One vX.Y.Z tag now feeds all four registries (crates.io, PyPI, Maven
# Central, GitHub Releases) as reusable-workflow jobs of this same run.
# No approval gate -- merging the version-bump PR is the real decision
# point; a gate after the tag is already pushed can't cleanly undo
# anything. vcpkg/Conan (CONTRIBUTING.md step 5) stays manual -- needs the
# release archives first.
#
# Tag push itself isn't gated by dry_run -- github-release.yml/python-publish.yml/
# java-publish.yml/publish.yml all need a real tag ref to build against.
# Only the publish steps inside those jobs honor dry_run.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      new_tag:
        description: "Override the vX.Y.Z tag"
        required: false
        type: string
      dry_run:
        description: "Dry Run: publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # head_commit is absent on workflow_dispatch, hence the event_name check
    # first. It's also the single new commit a squash/rebase merge produces --
    # multiple commits in one push would only check the last of them.
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')"
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -n "${NEW_TAG:-}" ]; then
            version="${NEW_TAG#v}"
            if ! echo "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::new_tag '${NEW_TAG}' doesn't look like a vX.Y.Z tag" >&2
              exit 1
            fi
          else
            version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Checked against origin: ls-remote needs the `^{}`-suffixed query to
        # peel an annotated tag to its commit SHA (unsuffixed returns the tag
        # object's own SHA instead). Not gated by dry_run -- see file header.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

  release:
    name: GitHub Release (cargo-dist)
    needs: tag-and-release
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}

  crates:
    name: crates.io
    needs: tag-and-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      dry_run: ${{ inputs.dry_run == true }}

  java:
    name: Maven Central (Java bindings)
    needs: tag-and-release
    permissions:
      contents: read
    uses: ./.github/workflows/java-publish.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}

  python:
    name: PyPI
    needs: tag-and-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/python-publish.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}
