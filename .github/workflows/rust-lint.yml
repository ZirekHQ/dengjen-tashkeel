name: Rust Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-lint-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (ort-dylib)
        # Same rationale as CI.yml's matching step -- the default clippy
        # pass above never compiles this cfg-gated path.
        run: cargo clippy -p dengjen-tashkeel --no-default-features --features ort-dylib -- -D warnings
      - name: cargo clippy (ort-dylib, python crate)
        # The wheel ships crates/python with ort-dylib; its find_onnxruntime_lib /
        # resolve_dylib_path code only exists under that feature.
        run: cargo clippy -p dengjen-tashkeel-python --no-default-features --features ort-dylib --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Licenses/bans/sources are cheap and don't need a full build. Advisories are also
          # covered by the separate `rustsec/audit-check` job above (kept as belt-and-braces).
          command: check licenses bans sources

  # Mirrors CI.yml's `test` job under cargo-llvm-cov instrumentation, so the
  # Cobertura report matches what that job exercises. Reports to GitHub's
  # own coverage feature since SonarCloud never scanned this workspace (sonar-project.properties).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov (workspace)
        run: cargo llvm-cov --workspace --no-fail-fast --cobertura --output-path cobertura.xml
      - name: upload coverage report
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1
        with:
          file: cobertura.xml
          language: Rust
          label: code-coverage/rust

  # Compiles against the pinned floor in [workspace.package].rust-version (Cargo.toml),
  # separate from the toolchain the jobs above use -- catches a dependency bump
  # or language feature that would silently raise the workspace's real MSRV.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.88.0" # must match [workspace.package].rust-version in Cargo.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (MSRV)
        # Explicit +toolchain: rust-toolchain.toml would otherwise win.
        run: cargo +1.88.0 check --workspace --locked

  # Runs against the release type scripts/next-version.sh would cut for the commits since
  # the last tag, so a breaking change can't ship under a minor/patch bump. Moved here from
  # publish-crates.yml, where it only failed after the tag and the other registries had published.
  semver-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-semver-checks
      # dengjen-tashkeel-cli has no `lib` target (bin-only), so only the core crate is checked.
      - name: cargo semver-checks (dengjen-tashkeel)
        run: bash .github/scripts/semver-check.sh dengjen-tashkeel
