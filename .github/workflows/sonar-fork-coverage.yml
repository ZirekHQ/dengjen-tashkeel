name: Sonar fork coverage

# Forks never get SONAR_TOKEN, so sonar.yml skips them. This workflow builds the checkout and
# its coverage report with only the secretless fork `pull_request` token, and must never gain
# `secrets:` access. sonar-fork-scan.yml analyses its artifact.

on:
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: sonar-fork-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Build coverage for fork scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Same-repo PRs are scanned directly by sonar.yml; only forks need this.
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not the default ephemeral merge commit: the scan must analyse a SHA
          # that matches the PR so the status lands on the commit branch protection checks.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # Sonar needs full history for new-code detection and blame
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the capi cdylib
        run: cargo build -p dengjen-tashkeel-capi --locked

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run ffi_usage_example.py's tests with coverage
        working-directory: crates/capi
        run: |
          pip install --only-binary :all: pytest==9.1.1 pytest-cov==7.1.0
          pytest test_ffi_usage_example.py --cov=. --cov-report=xml:coverage-python.xml

      # .git is left out: fork code ran in this workspace, so its git configuration is
      # untrusted. The scan job rebuilds history from the base repository.
      - name: Archive the workspace for the scan workflow
        run: tar -czf "$RUNNER_TEMP/workspace.tar.gz" -C "$GITHUB_WORKSPACE" --exclude=./.git --exclude=./target .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-fork-workspace
          path: ${{ runner.temp }}/workspace.tar.gz
          retention-days: 7
