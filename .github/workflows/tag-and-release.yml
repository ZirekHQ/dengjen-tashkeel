name: Tag and trigger release

# Only acts on the commit landing prepare-release.yml's version-bump PR
# (matched by its exact commit subject, the only commit on that branch).
# Every other push to main is a no-op here.
#
# One vX.Y.Z tag now triggers all four registries (crates.io, PyPI, Maven
# Central, GitHub Releases) via the dispatches below. vcpkg/Conan
# (CONTRIBUTING.md step 5) stays manual -- needs the release archives first.
#
# Tag push itself isn't gated by dry_run -- python-publish/java-publish/
# release.yml (cargo-dist) all need a real tag ref to dispatch against.
# Only the four environment:release-gated publish jobs honor dry_run.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      new_tag:
        description: "Override the vX.Y.Z tag"
        required: false
        type: string
      dry_run:
        description: "Dry Run: publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    # head_commit is absent on workflow_dispatch, hence the event_name check
    # first. It's also the single new commit a squash/rebase merge produces --
    # multiple commits in one push would only check the last of them.
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')"
    permissions:
      contents: write
      # GITHUB_TOKEN can trigger workflow_dispatch (but not re-trigger via push,
      # to block recursive runs) -- so no PAT is needed, and it's also why the
      # tag pushed below doesn't double-fire the other workflows' own tag triggers.
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -n "${NEW_TAG:-}" ]; then
            version="${NEW_TAG#v}"
            if ! echo "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::new_tag '${NEW_TAG}' doesn't look like a vX.Y.Z tag" >&2
              exit 1
            fi
          else
            version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Checked against origin: ls-remote needs the `^{}`-suffixed query to
        # peel an annotated tag to its commit SHA (unsuffixed returns the tag
        # object's own SHA instead). Not gated by dry_run -- see file header.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

  approve:
    name: Approve release
    needs: tag-and-release
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - env:
          VERSION: ${{ needs.tag-and-release.outputs.version }}
        run: echo "Approved v${VERSION} for release"

  dispatch:
    name: Trigger downstream releases
    needs: [tag-and-release, approve]
    # always() is paired with an explicit success-or-skipped check, not a bare "run regardless" --
    # needed because `approve` is legitimately skipped, not failed, on a dry run.
    if: always() && needs.tag-and-release.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag-and-release.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    # No -e: the tag is already pushed and can't be re-pushed on retry, so a
    # transient failure on one `gh workflow run` call must not abort the
    # rest -- every dispatch is attempted regardless, failing only at the end.
    steps:
      - name: Trigger downstream releases
        run: |
          set -uo pipefail
          failed=0
          dry_run_flag=()
          [ "$DRY_RUN" = "true" ] && dry_run_flag=(-f dry_run=true)
          # release.yml reads the version from github.ref_name itself, so it's
          # dispatched against the tag directly -- workflow_dispatch runs the
          # workflow file's content as it exists at --ref, like a real tag push.
          # No checkout in this job, so gh can't infer the target repo from
          # a local .git -- every call needs --repo explicitly.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v${VERSION}" "${dry_run_flag[@]}" || failed=1
          # python-publish.yml / java-publish.yml take an explicit `tag` input
          # and are dispatched against main, since their own checkouts resolve
          # the ref to build from `inputs.tag`, not the dispatch ref.
          gh workflow run python-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=v${VERSION}" "${dry_run_flag[@]}" || failed=1
          gh workflow run java-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=v${VERSION}" "${dry_run_flag[@]}" || failed=1
          # publish.yml takes no tag input, so it's dispatched against the tag
          # ref directly, not main -- otherwise an unrelated merge landing on
          # main between the tag push and this dispatch would publish the wrong commit.
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "v${VERSION}" "${dry_run_flag[@]}" || failed=1
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more downstream workflow dispatches failed -- check the Actions tab and manually dispatch any that didn't fire (safe to re-dispatch one that already ran; each is independently idempotent or version-checked)."
            exit 1
          fi
