name: Tag and trigger release

# Fires on every push to main, but only acts on the commit that lands
# prepare-release.yml's version-bump PR (identified by its exact commit
# subject -- squash- or rebase-merging that PR always produces this
# message, since it's the only commit on that branch). Every other push to
# main is a no-op here. Also dispatchable by hand, with a `new_tag`
# override and `dry_run` support, mirroring dengjen-tts's release.yml.
#
# Tags that commit vX.Y.Z (the baseline scripts/next-version.sh's next run
# diffs Conventional Commits from) and directly triggers every downstream
# release workflow, collapsing what used to be two separate manual tag
# pushes -- push vX.Y.Z (triggering release.yml, python-publish.yml,
# java-publish.yml), then push a second, differently-named publish-N tag
# (triggering publish.yml) -- into the single "review and merge the bump
# PR" gate. That merge (or manual dispatch) is the last human decision
# before four different registries (crates.io, PyPI, Maven Central,
# GitHub Releases) actually publish; the vcpkg/Conan follow-up in
# CONTRIBUTING.md's step 5 stays separate and manual, since real
# per-platform hashes can't exist before the release archives do.
#
# The tag push itself is NOT skipped on a dry run: python-publish.yml,
# java-publish.yml, and release.yml (cargo-dist) all need a real tag ref
# to dispatch against. Only the four environment:release-gated publishes
# are what dry_run actually gates here.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      new_tag:
        description: "Override the vX.Y.Z tag"
        required: false
        type: string
      dry_run:
        description: "Dry Run: publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    # head_commit is absent on workflow_dispatch, hence the event_name check first.
    # head_commit is the single new commit a squash/rebase merge produces;
    # a push landing more than one new commit at once (not this repo's
    # normal PR flow) would only inspect the last of them.
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')"
    permissions:
      contents: write
      # workflow_dispatch is the one event type GITHUB_TOKEN is explicitly
      # allowed to trigger a new run for -- unlike `push`, which it's
      # deliberately blocked from re-triggering to prevent recursive runs
      # (see "Triggering a workflow" in GitHub's Actions docs). No PAT
      # needed for the "Trigger downstream releases" step below because of
      # that; it's also why the vX.Y.Z tag pushed here doesn't itself fire
      # release.yml/python-publish.yml/java-publish.yml's own tag triggers
      # -- they're invoked explicitly instead.
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -n "${NEW_TAG:-}" ]; then
            version="${NEW_TAG#v}"
            if ! echo "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::new_tag '${NEW_TAG}' doesn't look like a vX.Y.Z tag" >&2
              exit 1
            fi
          else
            version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Checked against origin, not the local clone. An annotated tag peels to the commit SHA
        # via a separate `^{}`-suffixed query -- ls-remote only returns that line when asked for
        # it by name, so one unsuffixed query can't tell the two cases apart.
        # Not gated by dry_run -- see the workflow-level comment above.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

  approve:
    name: Approve release
    needs: tag-and-release
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - env:
          VERSION: ${{ needs.tag-and-release.outputs.version }}
        run: echo "Approved v${VERSION} for release"

  dispatch:
    name: Trigger downstream releases
    needs: [tag-and-release, approve]
    # always() is paired with an explicit success-or-skipped check, not a bare "run regardless" --
    # needed because `approve` is legitimately skipped, not failed, on a dry run.
    if: always() && needs.tag-and-release.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag-and-release.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    # No -e: the tag above is already pushed and can't be re-pushed on a
    # retry (git rejects an existing tag), so a transient failure on one
    # `gh workflow run` call must not abort the rest -- every dispatch
    # gets attempted regardless, and the step only fails at the end,
    # after every workflow that COULD be dispatched was.
    steps:
      - name: Trigger downstream releases
        run: |
          set -uo pipefail
          failed=0
          dry_run_flag=()
          [ "$DRY_RUN" = "true" ] && dry_run_flag=(-f dry_run=true)
          # release.yml (cargo-dist / GitHub Release) reads the version from
          # github.ref_name itself, so it's dispatched directly against the
          # tag -- workflow_dispatch runs the workflow file's own content as
          # it exists at --ref, same as a real tag push would have used.
          gh workflow run release.yml --ref "v${VERSION}" "${dry_run_flag[@]}" || failed=1
          # python-publish.yml / java-publish.yml take an explicit `tag`
          # input instead (python-publish.yml's own existing pattern, now
          # mirrored by java-publish.yml too) and are dispatched against
          # main, since every checkout inside them already resolves the ref
          # to actually build from `inputs.tag`, not the dispatch ref.
          gh workflow run python-publish.yml --ref main -f "tag=v${VERSION}" "${dry_run_flag[@]}" || failed=1
          gh workflow run java-publish.yml --ref main -f "tag=v${VERSION}" "${dry_run_flag[@]}" || failed=1
          # publish.yml (crates.io) takes no tag input, so it's dispatched
          # directly against the tag ref rather than main -- otherwise a
          # second, unrelated merge landing on main between the tag push
          # above and this dispatch would make it build (and publish to
          # crates.io) a different commit than the one v${VERSION} points
          # at.
          gh workflow run publish.yml --ref "v${VERSION}" "${dry_run_flag[@]}" || failed=1
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more downstream workflow dispatches failed -- check the Actions tab and manually dispatch any that didn't fire (safe to re-dispatch one that already ran; each is independently idempotent or version-checked)."
            exit 1
          fi
