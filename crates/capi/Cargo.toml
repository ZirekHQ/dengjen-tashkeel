[package]
name = "dengjen-tashkeel-capi"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true

[lib]
name = "dengjen_tashkeel_capi"
crate-type = ["cdylib"]

[features]
ort = ["dengjen-tashkeel/ort-static"]
default = ["ort"]
ort-dylib = ["dengjen-tashkeel/ort-dylib"]

[dependencies]
ffi-support = "0.4.4"
libc = "0.2.147"
once_cell = "1.18.0"

[dependencies.dengjen-tashkeel]
version = "1.5.2"
path = "../core"
default-features = false

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
tempfile = "3"

[package.metadata.dist]
cdylibs = ["dengjen_tashkeel_capi"]
package-libraries = ["cdylib"]
include = ["dengjen_tashkeel.h"]
installers = []
