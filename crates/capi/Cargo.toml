[package]
name = "dengjen-tashkeel-capi"
version = "1.5.2"
authors = ["Musharraf Omer<ibnomer2011@hotmail.com>"]
license = "MIT/Apache-2.0"
edition = "2021"
description = "Arabic-text diacritic restoration using neural networks"
repository = "https://github.com/ZirekHQ/dengjen-tashkeel"
documentation = "https://github.com/ZirekHQ/dengjen-tashkeel"

[lib]
name = "dengjen_tashkeel_capi"
crate-type = ["cdylib"]

[features]
ort = ["dengjen-tashkeel/ort-static"]
default = ["ort"]
ort-dylib = ["dengjen-tashkeel/ort-dylib"]

[dependencies]
ffi-support = "0.4.4"
libc = "0.2.147"
once_cell = "1.18.0"

[dependencies.dengjen-tashkeel]
version = "1.5.2"
path = "../core"
default-features = false

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
tempfile = "3"

[package.metadata.dist]
# Package the built cdylib (.so/.dylib/.dll) and its cbindgen-generated header
# together in release archives, per https://github.com/ZirekHQ/dengjen-tashkeel/issues/23
cdylibs = ["dengjen_tashkeel_capi"]
package-libraries = ["cdylib"]
include = ["dengjen_tashkeel.h"]
# capi has no binaries to install, so the shell/powershell/msi installers
# (workspace defaults, meant for the `cli` package) don't apply here.
installers = []
