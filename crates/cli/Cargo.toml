[package]
name = "dengjen-tashkeel-cli"
version = "1.5.2"
authors = ["Musharraf Omer<ibnomer2011@hotmail.com>"]
license = "MIT/Apache-2.0"
edition = "2021"
description = "Arabic-text diacritic restoration using neural networks"
repository = "https://github.com/ZirekHQ/dengjen-tashkeel"
documentation = "https://github.com/ZirekHQ/dengjen-tashkeel"

[package.metadata.wix]
upgrade-guid = "2A9A8753-788C-48B7-BAFA-47CF994C51FC"
path-guid = "B4095211-EE92-481A-B3EF-4B88238200A4"
license = false
eula = false

[[bin]]
name = "dengjen-tashkeel"
path = "src/main.rs"

[features]
default = ["ort"]
ort = ["dengjen-tashkeel/ort-static"]
ort-dylib = ["dengjen-tashkeel/ort-dylib"]

[dependencies]
anyhow = "1.0.72"
env_logger = "0.10.0"
log = "0.4.18"

[dependencies.clap]
version = "4.3.2"
features = ["derive",]

[dependencies.dengjen-tashkeel]
version = "1.5.2"
path = "../core"
default-features = false

[dev-dependencies]
tempfile = "3"
