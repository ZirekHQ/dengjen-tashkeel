[package]
name = "dengjen-tashkeel"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["ort-static", "rayon"]
rayon = ["dep:rayon"]
ort-static = ["dep:ort", "ort/download-binaries", "ort/copy-dylibs"]
ort-dylib = ["dep:ort", "ort/load-dynamic"]

[dependencies]
libtqsm = "0.6.1"
log = "0.4.18"
ndarray = "0.17"
once_cell = "1.18.0"
rayon = { version = "1.8.1", optional = true }
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"
thiserror = "1.0.47"

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "tls-rustls", "api-27"]
optional = true

[dev-dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]
