[package]
name = "dengjen-tashkeel"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["ort-static", "rayon", "bundled-model"]
# Embeds data/ort/model.onnx so `create_inference_engine(None)` needs no model path.
bundled-model = []
rayon = ["dep:rayon"]
ort-static = ["dep:ort", "dep:ndarray", "ort/download-binaries", "ort/copy-dylibs", "bundled-model"]
# Loads onnxruntime dynamically and bundles no model; callers pass a model path.
ort-dylib-external = ["dep:ort", "dep:ndarray", "ort/load-dynamic"]
ort-dylib = ["ort-dylib-external", "bundled-model"]
# Exposes otherwise-private tokenization/postprocessing internals (doc-hidden) so
# benches/ can measure hot paths without an ONNX model in the loop. Not for external use.
internal-benchmarks = []

[dependencies]
libtqsm = "0.6.1"
log = "0.4.18"
ndarray = { version = "0.17", optional = true }
once_cell = "1.18.0"
rayon = { version = "1.8.1", optional = true }
serde_json = "1.0.89"
thiserror = "2.0.0"

[dependencies.ort]
version = "=2.0.0-rc.15"
default-features = false
features = ["std", "ndarray", "tracing", "tls-rustls", "api-27"]
optional = true

[dev-dependencies.ort]
version = "=2.0.0-rc.15"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

[[bench]]
name = "hot_paths"
harness = false
required-features = ["internal-benchmarks"]
