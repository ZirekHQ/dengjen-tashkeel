[package]
name = "pylibtashkeel"
version = "1.5.1"
authors = ["Musharraf Omer<ibnomer2011@hotmail.com>"]
license = "MIT/Apache-2.0"
edition = "2021"
description = "Arabic-text diacritic restoration using neural networks"
repository = "https://github.com/ZirekHQ/libtashkeel"
documentation = "https://github.com/ZirekHQ/libtashkeel"

[lib]
name = "pylibtashkeel"
crate-type = ["cdylib"]

[features]
default = ["ort"]
ort = ["libtashkeel_core/ort"]
ort-dylib = ["libtashkeel_core/ort-dylib"]
extension-module = ["pyo3/extension-module"]

[dependencies.pyo3]
version = "0.29"
features = ["abi3-py39"]

[dev-dependencies.pyo3]
version = "0.29"
features = ["auto-initialize"]

[dependencies.libtashkeel_core]
path = "../core"
default-features = false
