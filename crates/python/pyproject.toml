[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "dengjen-tashkeel-py"
requires-python = ">=3.9"
dependencies = ["onnxruntime>=1.28,<2"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
no-default-features = true
features = ["ort-dylib", "extension-module"]
