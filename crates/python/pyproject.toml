[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "dengjen-tashkeel-py"
requires-python = ">=3.9"
dependencies = ["onnxruntime>=1.28,<2"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
# ort-dylib replaces the old default `ort` feature for distributed wheels:
# it loads onnxruntime dynamically from the `onnxruntime` pip package
# (glibc 2.17-compatible) instead of statically linking pyke's prebuilt
# binary (glibc 2.38+), which is what made issue #29 unfixable via the
# manylinux/CI image alone -- see the design doc referenced in the PR.
no-default-features = true
features = ["ort-dylib", "extension-module"]
