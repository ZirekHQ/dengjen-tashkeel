[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "dengjen-tashkeel-py"
description = "Python bindings for dengjen-tashkeel: Arabic diacritic restoration with a neural model"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["arabic", "tashkeel", "diacritics", "harakat", "nlp", "onnx"]
requires-python = ">=3.11"
dependencies = ["onnxruntime>=1.28,<2"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/ZirekHQ/dengjen-tashkeel"
Issues = "https://github.com/ZirekHQ/dengjen-tashkeel/issues"

[tool.maturin]
no-default-features = true
features = ["ort-dylib", "extension-module"]
