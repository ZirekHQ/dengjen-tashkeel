sonar.projectKey=ZirekHQ_dengjen-tashkeel
sonar.organization=zirekhq

# SonarCloud has no Rust analyzer, so crates/** isn't scanned here. Rust-native
# checks (clippy, cargo audit, cargo deny) live in .github/workflows/rust-lint.yml
# instead. This only covers what SonarCloud can actually analyse: the C header,
# the FFI usage example, and the workflow files themselves.
sonar.sources=crates/capi/dengjen_tashkeel.h,crates/capi/ffi_usage_example.py,.github/workflows

sonar.python.version=3.9
sonar.sourceEncoding=UTF-8

# Generated by .github/workflows/sonar.yml's "Run ffi_usage_example.py's
# tests with coverage" step before the scan step runs.
sonar.python.coverage.reportPaths=crates/capi/coverage-python.xml
